<!doctype html>
<!-- Parâmetros: ?concept=c1|c2|c3|c4|c5&ratio=4x5|1x1|9x16. Fontes locais da landing. -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>EDevsHub — estático</title>
<style>
@font-face{font-family:'Space Grotesk';src:url('./fonts/space-grotesk-latin.woff2');font-weight:300 700;font-display:block}
@font-face{font-family:Inter;src:url('./fonts/inter-latin.woff2');font-weight:100 900;font-display:block}
:root{--bg:#0a0c0b;--ink:#e8efec;--acc:#3fcf7f}*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}
#art{position:relative;width:1080px;height:1350px;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size-adjust:from-font;--top:220px;--title:116px;--step:116px;--proof:80px;--offer-y:788px;--offer:58px;--offer-line:63px;--price-y:935px;--rule-y:1070px;--sig-y:1108px}
#art[data-ratio="1x1"]{height:1080px;--top:90px;--title:96px;--step:100px;--proof:68px;--offer-y:550px;--offer:54px;--offer-line:59px;--price-y:692px;--rule-y:828px;--sig-y:866px}
/* 9:16: a largura util e a mesma do 4:5, entao o titulo nao tinha motivo para
   encolher. Mesma escala do 4:5, deslocada para ficar centralizada na area
   que o Stories e o Reels nao cobrem (y 269 a 1248). */
#art[data-ratio="9x16"]{height:1920px;--top:292px;--title:116px;--step:116px;--proof:80px;--offer-y:860px;--offer:58px;--offer-line:63px;--price-y:1007px;--rule-y:1142px;--sig-y:1180px}
h1,p{margin:0}h1{position:absolute;left:92px;top:var(--top);width:896px;font-size:var(--title);font-weight:700;line-height:var(--step);letter-spacing:-.035em}
.line{display:block;white-space:nowrap;overflow-wrap:normal;word-break:normal}.accent{color:var(--acc)}
/* C2: as linhas verdes usam corpo menor (--proof). Herdando a altura de linha do
   titulo grande (--step), texto de 80px ficava em linha de 116px e abria um vao
   entre "voltaram" e "a me contratar". A altura acompanha o proprio corpo. */
#art[data-concept="c2"] h1 .accent,
#art[data-concept="c4"] h1 .accent,
#art[data-concept="c6"] h1 .accent,
#art[data-concept="c5"] h1 .accent{font-size:var(--proof);line-height:calc(var(--proof) * 1.12);letter-spacing:-.025em}
#art[data-concept="c2"] h1 .accent:nth-child(3),
#art[data-concept="c4"] h1 .accent:nth-child(3),
#art[data-concept="c6"] h1 .accent:nth-child(3),
#art[data-concept="c5"] h1 .accent:nth-child(3){margin-top:18px}
/* C5 nomeia o comprador antes da situação. Só o gancho muda: oferta, preço,
   prazo e assinatura preservam a geometria e os pixels de C3/C4. */
#art[data-concept="c5"]{--title:108px}
#art[data-concept="c5"][data-ratio="1x1"]{--title:94px}
.offer,.price,.rule,.sig{position:absolute;left:92px;width:896px}
.offer{top:var(--offer-y);font-size:var(--offer);line-height:var(--offer-line);font-weight:700;letter-spacing:-.02em}
.price{top:var(--price-y);font:400 46px/1.25 Inter,sans-serif}
.rule{top:var(--rule-y);height:4px;background:var(--acc)}
.sig{top:var(--sig-y);font:600 30px/1.3 Inter,sans-serif;letter-spacing:.01em}
</style></head><body>
<main id="art" data-concept="c1" data-ratio="4x5">
<h1><span class="line">Sua operação</span><span class="line">cresceu.</span><span class="line accent">Seus sistemas,</span><span class="line accent">não.</span></h1>
<p class="offer"><span class="line">Integração entre os sistemas</span><span class="line">que você já usa</span></p>
<p class="price">A partir de R$ 6 mil</p><div class="rule" aria-hidden="true"></div><p class="sig">Eduardo Gouveia · EDevsHub</p>
</main><script>
const params=new URLSearchParams(location.search),concept=params.get('concept')||'c1',ratio=params.get('ratio')||'4x5';
if(!['c1','c2','c3','c4','c5','c6'].includes(concept)||!['4x5','1x1','9x16'].includes(ratio))throw new Error('Parâmetros inválidos');
const art=document.querySelector('#art');art.dataset.concept=concept;art.dataset.ratio=ratio;
const titulos={c2:['176 sistemas','entregues.','37 clientes voltaram','a me contratar.'],c3:['Sua operação','cresceu.','Seus sistemas,','não.'],c4:['176 sistemas','entregues.','37 clientes voltaram','a me contratar.'],c5:['Dono ou gestor','de PME?','Sua equipe controla','pedidos na planilha?'],c6:['Sua equipe ainda','usa planilha?','Dá para ter um','sistema só de vocês.']};if(titulos[concept]){document.querySelectorAll('h1 .line').forEach((el,i)=>el.textContent=titulos[concept][i]);}
/* c3 e c4 vendem sistema sob medida a partir de R$ 5 mil, com prazo. A oferta
   antiga (integração a partir de R$ 6 mil) não era o que o Eduardo cobra. */
if(['c3','c4','c5','c6'].includes(concept)){const o=document.querySelectorAll('.offer .line');o[0].textContent='Sistema ou app sob medida';o[1].textContent='para o jeito que você trabalha';document.querySelector('.price').textContent='A partir de R$ 5 mil · 2 a 4 semanas';}
</script></body></html>
