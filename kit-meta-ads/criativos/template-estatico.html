<!doctype html>
<!--
  Template dos estáticos do Meta Ads, renderizado por código e não por IA.

  Por que código: estático tipográfico não precisa de gerador de imagem. Aqui a
  cor é exata (#0a0c0b, a IA entregou #060909), a resolução é a que o Meta pede
  (1080x1350, a IA entregou 896x1120), a fonte é a Space Grotesk de verdade (a
  mesma da landing, não "parecida"), os acentos nunca erram e cada variação
  custa zero crédito.

  Para gerar: abrir num navegador com viewport 1080x1350, esperar
  document.fonts.ready e tirar screenshot do #art. Para 1:1 trocar a altura
  para 1080; para 9:16, 1080x1920 respeitando a área segura do Stories.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root { --bg:#0a0c0b; --ink:#e8efec; --acc:#3fcf7f; }
  html,body { margin:0; background:var(--bg); }
  .art {
    width:1080px; height:1350px; box-sizing:border-box;
    padding:118px 92px 96px;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; justify-content:center;
    font-family:'Space Grotesk', sans-serif;
  }
  h1 {
    margin:0; font-weight:700;
    font-size:116px; line-height:1.0; letter-spacing:-0.035em; white-space:nowrap;
  }
  h1 .a { color:var(--acc); }
  .offer { margin-top:104px; }
  .offer p { margin:0; }
  .o1 { font-weight:700; font-size:58px; line-height:1.08; letter-spacing:-0.02em; }
  .o2 { font-family:'Inter',sans-serif; font-weight:400; font-size:46px; margin-top:22px !important; color:#c9d3cf; }
  .rule { height:4px; background:var(--acc); margin:80px 0 34px; }
  .sig { font-family:'Inter',sans-serif; font-weight:600; font-size:30px; color:#aab6b2; letter-spacing:0.01em; }
</style>
</head>
<body>
  <div class="art" id="art">
    <h1>Sua operação<br>cresceu.<br><span class="a">Seus sistemas,<br>não.</span></h1>
    <div class="offer">
      <p class="o1">Integração entre os sistemas<br>que você já usa</p>
      <p class="o2">A partir de R$ 6 mil</p>
    </div>
    <div class="rule"></div>
    <div class="sig">Eduardo Gouveia · EDevsHub</div>
  </div>
</body>
</html>
