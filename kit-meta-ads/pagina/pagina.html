<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:'Space Grotesk';src:url('../criativos/fonts/space-grotesk-latin.woff2');font-weight:300 700}
@font-face{font-family:Inter;src:url('../criativos/fonts/inter-latin.woff2');font-weight:100 900}
html,body{margin:0;background:#0a0c0b}
#perfil{width:1080px;height:1080px;background:#0a0c0b;display:grid;place-items:center}
#perfil img{width:560px;height:560px}
#capa{width:1640px;height:624px;background:#0a0c0b;color:#e8efec;font-family:'Space Grotesk',sans-serif;box-sizing:border-box;
 /* Facebook recorta a capa nas laterais no celular: o texto fica na faixa central */
 padding:0 330px;display:flex;flex-direction:column;justify-content:center}
#capa h1{margin:0;font-size:84px;line-height:1;letter-spacing:-.035em;font-weight:700}
#capa h1 span{color:#3fcf7f;display:block}
#capa p{margin:28px 0 0;font:500 30px/1.3 Inter,sans-serif;color:#b9c4c1}
</style></head><body>
<div id="perfil"><img src="icone.svg" alt=""></div>
<div id="capa"><h1>Sua operação cresceu.<span>Seus sistemas, não.</span></h1><p>Software sob medida · edevshub.com</p></div>
</body></html>
